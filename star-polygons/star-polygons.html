<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Star Polygon Notation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="star-polygons.css" />
</head>

<body>
  <canvas id="canvas"></canvas>
  <div id="controls">
    <label>Number of vertices: <input type="number" inputmode="numeric" id="points" min="3" value="5" /></label>
    <label>Turning number: <input type="number" inputmode="numeric" id="hops" min="1" value="1" /></label>
    <label>Number of polygons: <input type="number" inputmode="numeric" id="numberOfPolygons" min="1" value="3" /></label>
    <label>Polygon turning number: <input type="number" inputmode="numeric" id="polygonTurningNumber" min="1" value="1" /></label>
  </div>
  <script src="../rendering/color.js"></script>
  <script src="../rendering/vector.js"></script>
  <script src="../rendering/matrix.js"></script>
  <script src="../rendering/shape.js"></script>
  <script src="../rendering/camera.js"></script>
  <script src="../rendering/scene.js"></script>
  <script src="linked-list.js"></script>
  <script src="star-polygons.js"></script>
  <script>
    function initControls() {
      const controls = {
        points: document.getElementById("points"),
        hops: document.getElementById("hops"),
        numberOfPolygons: document.getElementById("numberOfPolygons"),
        polygonTurningNumber: document.getElementById("polygonTurningNumber")
      };
      for (const key in controls) {
        controls[key].addEventListener("input", renderScene);
      }
      renderScene();
    }
    window.addEventListener("resize", renderScene);
    window.addEventListener("load", () => {
      initControls();
    });
  </script>
</body>

</html>
