<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Camera Matrix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="camera-matrix.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="controls">
      <details id="camera-controls">
        <summary>Camera Controls</summary>
        <div id="polygon-controls">
          <label
            >Focal Distance:
            <input
              type="number"
              id="focalDistance"
              step="1"
              min="1"
              max="100"
              value="50"
          /></label>
          <label
            >Principal X:
            <input type="number" id="principalX" step="0.1" value="0"
          /></label>
          <label
            >Principal Y:
            <input type="number" id="principalY" step="0.1" value="0"
          /></label>
          <label
            >Skew Coefficient:
            <input type="number" id="skewCoefficient" step="0.1" value="0"
          /></label>
          <label
            >Translation X:
            <input type="number" id="translationX" step="1" value="0"
          /></label>
          <label
            >Translation Y:
            <input type="number" id="translationY" step="1" value="0"
          /></label>
          <label
            >Translation Z:
            <input type="number" id="translationZ" step="1" value="700"
          /></label>
        </div>
      </details>
      <details id="shape-controls" open>
        <summary>Shape Controls</summary>
        <select id="shape">
          <option value="tetragon">Tetragon</option>
          <option value="cube">Cube</option>
          <option value="octahedron">Octahedron</option>
          <option value="dodecahedron">Dodecahedron</option>
          <option value="icosahedron">Icosahedron</option>
        </select>
        <div id="rotation-controls">
          <label
            >Rotation X:
            <input type="number" id="rotationX" step="0.1" value="0"
          /></label>
          <label
            >Rotation Y:
            <input type="number" id="rotationY" step="0.1" value="0"
          /></label>
          <label
            >Rotation Z:
            <input type="number" id="rotationZ" step="0.1" value="0"
          /></label>
        </div>
      </details>
    </div>
    <script src="../rendering/color.js"></script>
    <script src="../rendering/vector.js"></script>
    <script src="../rendering/matrix.js"></script>
    <script src="../rendering/shape.js"></script>
    <script src="../rendering/camera.js"></script>
    <script src="../rendering/scene.js"></script>
    <script src="camera-matrix.js"></script>
    <script>
      function initControls() {
        const shapeSelect = document.getElementById("shape");
        shapeSelect.value = "icosahedron";
        const controls = {
          focalDistance: document.getElementById("focalDistance"),
          principalX: document.getElementById("principalX"),
          principalY: document.getElementById("principalY"),
          skewCoefficient: document.getElementById("skewCoefficient"),
          translationX: document.getElementById("translationX"),
          translationY: document.getElementById("translationY"),
          translationZ: document.getElementById("translationZ"),
          rotationX: document.getElementById("rotationX"),
          rotationY: document.getElementById("rotationY"),
          rotationZ: document.getElementById("rotationZ"),
        };
        const update = () => {
          camera.focalLength = parseFloat(controls.focalDistance.value);
          camera.principalX = parseFloat(controls.principalX.value);
          camera.principalY = parseFloat(controls.principalY.value);
          camera.skew = parseFloat(controls.skewCoefficient.value);
          camera.translationVector.x = parseFloat(controls.translationX.value);
          camera.translationVector.y = parseFloat(controls.translationY.value);
          camera.translationVector.z = parseFloat(controls.translationZ.value);
          rotationX = parseFloat(controls.rotationX.value);
          rotationY = parseFloat(controls.rotationY.value);
          rotationZ = parseFloat(controls.rotationZ.value);
          renderScene();
        };
        const updateShape = () => {
          const val = shapeSelect.value;
          selectedShape = val.charAt(0).toUpperCase() + val.slice(1);
          renderScene();
        };
        for (const key in controls) {
          controls[key].addEventListener("input", update);
        }
        shapeSelect.addEventListener("change", updateShape);
        // initialize
        selectedShape =
          shapeSelect.value.charAt(0).toUpperCase() +
          shapeSelect.value.slice(1);
        update();
      }
      window.addEventListener("resize", renderScene);
      window.addEventListener("load", () => {
        renderScene();
        initControls();
      });
    </script>
  </body>
</html>
