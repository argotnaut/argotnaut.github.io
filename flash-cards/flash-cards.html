<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Flash Card</title>
<link rel="stylesheet" href="./flash-cards.css"/>

</head>
<body>
<div id="stats">Correct: <span id="correctCount">0</span>, Incorrect: <span id="incorrectCount">0</span></div>

<div id="card-container">
  <div id="flashcard" class="card" tabindex="0">
    <div class="face front"></div>
    <div class="face back"></div>
  </div>
  <div id="buttons" style="display:none; margin-top:10px; text-align:center;">
    <button id="correctBtn" class="action correct">Correct</button>
    <button id="incorrectBtn" class="action incorrect">Incorrect</button>
</div>

  <div id="inputContainer" style="display:none; margin-top:10px; text-align:center;">
    <input type="text" id="answerInput" style="width:80%; padding:5px; font-size:1rem;" />
    <button id="answerSubmitBtn">Submit</button>
  </div>
  <div id="answerIcon" style="display:none; margin-top:10px; text-align:center; font-size:2rem;">✓</div>

</div>

<!-- Drawer for JSON input -->
<div id="drawer" class="drawer closed">
  <div id="drawerToggle" class="hamburger" title="Open JSON drawer">☰</div>
  <div id="drawerContent"><h3 style="margin:10px 10px 10px 50px;">Flashcard JSON</h3>
  <textarea id="jsonInput" style="width:95%; height:200px; margin:0 10px;"></textarea>
  
  <div style="text-align:center; margin-top:10px;">
    <button id="submitBtn">Submit</button>
  </div>
  <!-- Settings Menu -->
  <div id="settingsMenu" style="margin-top:10px;">
    <label style="display:block; margin-bottom:5px;">
      <input type="checkbox" id="darkModeToggle" /> Dark Mode
    </label>
    <label style="display:block; margin-bottom:5px;">
      Card order:
      <select id="orderSelect" style="margin-left:5px;">
        <option value="order">In order</option>
        <option value="random">Random</option>
        <option value="other">Other</option>
      </select>
    </label>
  </div>
</div>
</div>

<script src="./flash-cards.js"></script>
</body>
</html>
